<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Inventario</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Inventario de productos</h1>

  <form id="formulario">
    <input type="hidden" id="id">
    <input id="nombre" placeholder="Nombre">
    <input id="precio" type="number" step="0.01" placeholder="Precio">
    <input id="cantidad" type="number" step="1" placeholder="Cantidad">
    <button type="submit">Guardar</button>
    <button type="reset">Limpiar</button>
  </form>
  <p id="mensaje" role="status"></p>

  <table>
    <thead><tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Cantidad</th><th>Acciones</th></tr></thead>
    <tbody id="productos"></tbody>
  </table>
  <script src="js/listar.js"></script>
  <script src="js/crear.js"></script>
  <script src="js/editar.js"></script>
</body>
</html>
